name: neet-compass

services:
  db:
    image: postgres:16-alpine
    container_name: neet-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neet_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-neet_compass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neet} -d ${POSTGRES_DB:-neet_compass}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: neet-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: neet-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-neet}:${POSTGRES_PASSWORD:-neet_dev_password}@db:5432/${POSTGRES_DB:-neet_compass}
      REDIS_URL: redis://cache:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./data/cache:/data/cache
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
