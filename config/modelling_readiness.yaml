# NEET Compass AI - Modelling Readiness Registry
#
# Machine-readable registry of historical dataset modelling readiness.
# Reuses source_ids from config/data_sources.yaml.
# Does NOT duplicate data_sources.yaml - references it by source_id.
#
# This registry answers:
#   - Which historical datasets exist?
#   - Which are verified?
#   - Which are modelling-ready?
#   - Which years are available?
#   - Which targets are supported?
#   - What limitations exist?

version: 1

# Readiness classifications (matching Phase 2)
readiness_levels:
  - READY
  - READY_WITH_LIMITATIONS
  - NOT_READY

# Verification statuses (from data_sources.yaml)
verification_statuses:
  - VERIFIED
  - VERIFIED_URL_PURPOSE_NOT_FULLY_VERIFIED
  - NOT_VERIFIED

# Dataset entries: one per source_id × dataset × year × round
