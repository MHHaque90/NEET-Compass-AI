      counselling. Domain verified as the official MCC portal. Live re-check
      2026-08-12 (Sprint 3.1A): first-contact GET returned HTTP 200 text/html;
      automated full downloads from the same session rejected HTTP 403 (server
      bot protection) - see data/raw/evidence/2026-08-12/mcc_live_evidence.json.

