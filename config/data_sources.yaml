# NEET Compass AI - Official Source Registry
#
# RESEARCH REGISTRY ONLY.
#
# This file is the machine-readable inventory of official data sources for the
# NEET UG (MBBS/BDS) counselling domain. It is documentation for the official-
# source intelligence layer (docs/data-sources/) and MUST NOT be used to
# scrape, download, or ingest data at runtime. No scraping logic lives here.
#
# Source of truth: docs/data-sources/source-registry.md
#
# Research methodology:
#   * Only sources actually verified during research are recorded.
#   * A URL that is real but whose exact purpose could not be fully verified is
#     marked VERIFIED_URL_PURPOSE_NOT_FULLY_VERIFIED.
#   * A source that could not be verified is marked NOT_VERIFIED and carries no
#     official_url.
#   * No URL is reconstructed from memory and no third-party source is
#     silently substituted for an official source.
#
# Research / access date: 2026-08-12

version: 1

enums:
  verification_statuses:
    - VERIFIED
    - VERIFIED_URL_PURPOSE_NOT_FULLY_VERIFIED
    - NOT_VERIFIED
  priorities:
    - P0
    - P1
  authority_levels:
    - REGULATORY
    - EXAMINATION
    - STATE_AUTHORITY
    - CENTRAL_INSTITUTION
  scopes:
    - NATIONAL
    - ALL_INDIA
    - STATE_QUOTA
    - INSTITUTIONAL
  courses:
    - MBBS
    - BDS
    - MBBS+BDS
    - MBBS+BDS+NURSING
  publication_statuses:
    - PUBLISHED
    - NOT_VERIFIED
  formats:
    - PDF
    - XLSX
    - CSV
    - HTML
    - MULTIPLE
    - NOT_VERIFIED

